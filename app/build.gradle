plugins {
    id 'com.android.application'
}

android {
    namespace 'az.budcem.premium'
    compileSdk 35

    defaultConfig {
        applicationId 'az.budcem.premium'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
