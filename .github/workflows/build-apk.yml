name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat payload/part1.txt payload/part2.txt payload/part3.txt payload/part4.txt payload/part5.txt | base64 -d > budcem-source.zip
          unzip -q budcem-source.zip
          test -f Budcem_Android/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: Budcem_Android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: cp Budcem_Android/app/build/outputs/apk/debug/app-debug.apk Budcem-Premium.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Budcem-Premium-APK
          path: Budcem-Premium.apk
          if-no-files-found: error

      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" Budcem-Premium.apk \
            --target "${GITHUB_SHA}" \
            --title "Büdcəm Premium • Build ${GITHUB_RUN_NUMBER}" \
            --notes "Android üçün quraşdırıla bilən Büdcəm Premium APK. Telefona Budcem-Premium.apk faylını yükləyib quraşdırın." \
            --latest
